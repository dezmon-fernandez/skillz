<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Annotate: __NAME__</title>
<style>__CSS__</style>
</head>
<!-- Styled with Tailwind's own classes only; references/design.md says which each element uses. -->
<body class="group/page flex h-screen bg-zinc-50 text-sm text-zinc-900 dark:bg-zinc-900 dark:text-zinc-200">
<nav aria-label="Documents" class="flex w-68 flex-none flex-col border-r border-zinc-200 bg-white dark:border-white/5 dark:bg-zinc-950/30">
  <div class="min-h-0 flex-1 overflow-auto px-3 py-4">
    <h2 class="mx-2 mb-2 text-xs font-semibold text-zinc-500 dark:text-zinc-400">Documents</h2>
    <div id="documents"></div>
    <div class="mt-4 grid gap-1 px-2 text-xs text-zinc-500 dark:text-zinc-400">
      <p class="flex items-center gap-2" id="changed-hint" hidden><span class="size-3 flex-none border-l-4 border-emerald-500 bg-emerald-50 dark:border-emerald-400/70 dark:bg-emerald-400/10"></span><span id="changed-label">Changed since your last Send</span></p>
      <p class="flex items-center gap-2" id="removed-hint" hidden><span class="size-3 flex-none border-l-4 border-rose-500 bg-rose-50 dark:border-rose-400/70 dark:bg-rose-400/10"></span><span id="removed-label">Removed since your last Send</span></p>
      <p>Click a line to comment. ⌘↵ sends.</p>
    </div>
  </div>
  <div class="grid gap-3 border-t border-zinc-200 p-4 dark:border-zinc-800">
    <label for="instruction" class="text-xs font-semibold text-zinc-500 dark:text-zinc-400">Note for the agent (optional)</label>
    <textarea id="instruction" rows="2" placeholder="e.g. apply these, then tighten the intro" class="w-full resize-y rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm text-zinc-900 placeholder:text-zinc-400 focus:border-transparent focus:outline-2 focus:-outline-offset-1 focus:outline-zinc-900 dark:border-white/10 dark:bg-zinc-950/40 dark:text-zinc-100 dark:placeholder:text-zinc-600 dark:focus:outline-zinc-100"></textarea>
    <div class="flex gap-2">
      <button id="send" class="h-8 flex-1 cursor-pointer rounded-lg bg-zinc-900 px-3 text-sm font-semibold whitespace-nowrap text-white enabled:hover:bg-zinc-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-zinc-100 dark:text-zinc-900 dark:enabled:hover:bg-zinc-300 dark:focus-visible:outline-zinc-100">Send</button>
      <button id="copy" class="h-8 cursor-pointer rounded-lg bg-zinc-100 px-3 text-sm whitespace-nowrap text-zinc-900 enabled:hover:bg-zinc-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-zinc-800 dark:text-zinc-100 dark:enabled:hover:bg-zinc-700 dark:focus-visible:outline-zinc-100">Copy</button>
    </div>
    <p class="min-h-4 text-xs text-zinc-500 dark:text-zinc-400" id="status" role="status"></p>
    <section class="max-h-80 overflow-y-auto border-l-2 border-zinc-200 pl-3 text-zinc-500 dark:border-zinc-700 dark:text-zinc-400" id="agent-reply" aria-label="Agent's reply to your last Send" hidden>
      <h3 class="mb-1 text-xs font-semibold text-zinc-900 dark:text-zinc-100">Agent's reply</h3>
      <div class="grid gap-1" id="agent-reply-text"></div>
    </section>
  </div>
</nav>
<main class="min-w-0 flex-1 overflow-auto px-8 pt-6 pb-64">
  <p class="sticky top-0 z-20 mx-auto mb-4 max-w-7xl rounded-lg border border-zinc-200 bg-zinc-50 px-3 py-2 shadow-sm group-data-compare/page:max-w-none dark:border-white/10 dark:bg-zinc-800" id="working" role="status" hidden></p>
  <div class="mx-auto mb-6 flex max-w-7xl items-start justify-between gap-6 group-data-compare/page:max-w-none">
    <h1 class="min-w-0 text-lg/6 font-semibold wrap-anywhere" id="title"></h1>
    <label class="inline-flex flex-none cursor-pointer items-center gap-2 text-zinc-500 dark:text-zinc-400" id="view" hidden><input type="checkbox" role="switch" id="compare" class="relative h-4 w-7 cursor-pointer appearance-none rounded-full bg-zinc-200 transition-colors after:absolute after:top-0.5 after:left-0.5 after:size-3 after:rounded-full after:bg-white after:shadow-sm after:transition-transform checked:bg-zinc-900 checked:after:translate-x-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900 dark:bg-zinc-700 dark:after:bg-zinc-950 dark:checked:bg-zinc-100 dark:focus-visible:outline-zinc-100"> Side by side</label>
  </div>
  <div class="group-data-compare/page:grid group-data-compare/page:grid-cols-2 group-data-compare/page:gap-8" id="sheets"></div>
</main>
<!-- The comment box. Closed, it waits here; open, it sits in the margin beside the lines it is about (openEditor). -->
<section class="absolute right-0 z-10 grid w-84 gap-2 group-data-compare/page:w-64 rounded-lg border border-zinc-200 bg-white p-3 shadow-xl shadow-black/10 dark:border-white/10 dark:bg-zinc-800 dark:shadow-black/40" id="editor" aria-label="Comment on this section" hidden>
  <p class="grid gap-1 text-xs text-zinc-500 dark:text-zinc-400" id="quoted"></p>
  <label for="comment" class="sr-only">Comment</label>
  <textarea id="comment" class="min-h-20 w-full resize-y rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm text-zinc-900 field-sizing-content placeholder:text-zinc-400 focus:border-transparent focus:outline-2 focus:-outline-offset-1 focus:outline-zinc-900 dark:border-white/10 dark:bg-zinc-950/40 dark:text-zinc-100 dark:placeholder:text-zinc-600 dark:focus:outline-zinc-100"></textarea>
  <div class="flex flex-wrap items-center gap-2">
    <button id="send-now" title="Save this comment and send every comment (⌘↵)" class="h-8 cursor-pointer rounded-lg bg-zinc-900 px-3 text-sm font-semibold whitespace-nowrap text-white enabled:hover:bg-zinc-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-zinc-100 dark:text-zinc-900 dark:enabled:hover:bg-zinc-300 dark:focus-visible:outline-zinc-100">Send<span class="ml-2 text-xs font-normal opacity-60">⌘↵</span></button>
    <button id="save" class="h-8 cursor-pointer rounded-lg bg-zinc-100 px-3 text-sm whitespace-nowrap text-zinc-900 enabled:hover:bg-zinc-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-zinc-800 dark:text-zinc-100 dark:enabled:hover:bg-zinc-700 dark:focus-visible:outline-zinc-100">Save</button>
    <span class="ml-auto flex gap-2">
      <button id="clear" class="h-8 cursor-pointer rounded-lg px-2 text-sm whitespace-nowrap text-zinc-500 hover:text-red-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900 dark:text-zinc-400 dark:hover:text-red-400 dark:focus-visible:outline-zinc-100">Delete</button>
      <button id="close" class="h-8 cursor-pointer rounded-lg px-2 text-sm whitespace-nowrap text-zinc-500 hover:text-zinc-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 dark:focus-visible:outline-zinc-100">Cancel</button>
    </span>
  </div>
</section>
<script>
const DATA = __DATA__;
const STORAGE_KEY = "annotate:" + DATA.key;
const META_KEY = STORAGE_KEY + ":meta";
const notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
const meta = JSON.parse(localStorage.getItem(META_KEY) || "{}");
const byId = (id) => document.getElementById(id);
const editor = byId("editor");
let current = 0;
let compare = localStorage.getItem("annotate:compare") === "true";
let working = false; // true from a Send until the agent reopens the page
let selection = null;
let hovered = null;
let drag = null;
let lastClicked = null;

// The classes on what the script builds. Each is written out whole, so the stylesheet compiler finds it.
// A row's states are data attributes the script sets (data-changed, data-commented, data-selected) and the body's
// are data-working and data-compare; the classes below style each one. A selected row shows as selected even when
// it also changed.
const ROW = "line group/line flex cursor-pointer gap-3 rounded border-l-4 border-transparent px-2 text-sm/6 whitespace-pre-wrap select-none hover:bg-zinc-100 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-zinc-900 data-selected:border-zinc-900 data-selected:bg-zinc-100 data-changed:not-data-selected:border-emerald-500 data-changed:not-data-selected:bg-emerald-50 group-data-working/page:cursor-default group-data-working/page:data-commented:opacity-60 dark:hover:bg-white/5 dark:focus-visible:outline-zinc-100 dark:data-selected:border-zinc-100 dark:data-selected:bg-white/5 dark:data-changed:not-data-selected:border-emerald-400/70 dark:data-changed:not-data-selected:bg-emerald-400/10";
const TEXT = "min-w-0 flex-1 group-data-commented/line:bg-amber-200/50 group-data-commented/line:underline group-data-commented/line:decoration-amber-400 group-data-commented/line:decoration-2 group-data-commented/line:underline-offset-4 dark:group-data-commented/line:bg-amber-300/15 dark:group-data-commented/line:decoration-amber-300/70";
const FENCE = TEXT + " bg-zinc-100 px-3 font-mono text-xs/6 dark:bg-black/20";
const CELL = "md-cell border-r border-b border-zinc-200 px-3 py-1 first:border-l group-data-commented/line:bg-amber-200/50 dark:border-zinc-800 dark:group-data-commented/line:bg-amber-300/15";
const HEADING = ["text-lg font-semibold", "text-base font-semibold", "font-semibold", "font-semibold"];
const CODE_SPAN = "rounded bg-zinc-100 px-1 font-mono text-xs wrap-anywhere dark:bg-zinc-800";
const TOKEN = {
  keyword: "text-violet-700 dark:text-violet-300",
  decorator: "text-violet-700 dark:text-violet-300",
  string: "text-cyan-700 dark:text-cyan-300",
  comment: "text-zinc-500 italic dark:text-zinc-400",
  function: "text-blue-700 dark:text-blue-300",
  number: "text-blue-700 dark:text-blue-300",
  type: "text-fuchsia-700 dark:text-fuchsia-300",
  placeholder: "text-zinc-500 italic dark:text-zinc-400",
};
const FIELD = "w-full resize-y rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm text-zinc-900 placeholder:text-zinc-400 focus:border-transparent focus:outline-2 focus:-outline-offset-1 focus:outline-zinc-900 dark:border-white/10 dark:bg-zinc-950/40 dark:text-zinc-100 dark:placeholder:text-zinc-600 dark:focus:outline-zinc-100";
// Blocks that sit between rows start their text where a row's text starts: past a gutter and a number.
const inset = () => [element("span", "w-5 flex-none"), element("span", "w-8 flex-none")];

const documentAt = () => DATA.documents[current];
const itemById = (id) => DATA.documents.find((item) => item.id === id);
const siblingOf = (item) => DATA.documents.find((other) => other.group === item.group && other.id !== item.id);
const isBaseline = (item) => /^(old|without)_/.test(item.version);
const rangeKey = (item, start, end) => item.id + ":" + start + "-" + end;
const persist = () => { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); localStorage.setItem(META_KEY, JSON.stringify(meta)); };

// A document's id carries a hash of its text, so comments on a version the agent has since edited are dropped here.
const known = new Set(DATA.documents.map((item) => item.id));
Object.keys(notes).forEach((key) => { if (!known.has(key.slice(0, key.lastIndexOf(":")))) delete notes[key]; });
Object.keys(meta).forEach((id) => { if (!known.has(id)) delete meta[id]; });
persist();
const lineLabel = (start, end) => (start === end ? "Line " + (start + 1) : "Lines " + (start + 1) + "-" + (end + 1));
const sheetOf = (item) => document.querySelector('.sheet[data-id="' + CSS.escape(item.id) + '"]');
const rowAt = (sheet, index) => sheet.querySelector('.line[data-index="' + index + '"]');
const metaOf = (item) => meta[item.id] || (meta[item.id] = { reviewed: false, overall: "" });
const versionLabel = (item) => item.version.replaceAll("_", " ");
const element = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};

function notesOf(item) {
  return Object.entries(notes)
    .filter(([key]) => key.startsWith(item.id + ":"))
    .map(([key, note]) => {
      const [start, end] = key.slice(item.id.length + 1).split("-").map(Number);
      return { key, start, end, comment: note.comment };
    })
    .sort((first, second) => first.start - second.start || first.end - second.end);
}

function shownItems() {
  const item = documentAt();
  const sibling = siblingOf(item);
  if (!compare || !sibling) return [item];
  return [item, sibling].sort((first, second) => Number(isBaseline(first)) - Number(isBaseline(second)));
}

function renderDocuments() {
  byId("documents").replaceChildren(...DATA.documents.map((item, index) => {
    // aria-[current=true] is an arbitrary variant because Tailwind has no aria-current one.
    const button = element("button", "flex w-full cursor-pointer items-center gap-2 rounded-lg px-2 py-1 text-left hover:bg-zinc-100 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-zinc-900 aria-[current=true]:bg-zinc-200/70 dark:hover:bg-zinc-800 dark:focus-visible:outline-zinc-100 dark:aria-[current=true]:bg-zinc-700/60");
    button.setAttribute("aria-current", String(shownItems().some((shown) => shown.id === item.id)));
    const done = element("span", "flex-none text-zinc-500 empty:hidden dark:text-zinc-400", metaOf(item).reviewed ? "✓" : "");
    const count = element("span", "min-w-5 flex-none rounded-full bg-amber-200/50 px-2 text-center text-xs/5 empty:hidden dark:bg-amber-300/15", notesOf(item).length || "");
    const cut = item.title.lastIndexOf("/");
    const name = element("span", "min-w-0 flex-1");
    name.append(element("span", "block truncate", item.title.slice(cut + 1)), element("span", "block truncate text-xs text-zinc-500 empty:hidden dark:text-zinc-400", item.title.slice(0, cut + 1)));
    name.title = item.title;
    button.append(done, name, count);
    button.onclick = () => { current = index; lastClicked = null; closeEditor(); render(); };
    return button;
  }));
}

// The helper serves images from the document's own folder, so the page still makes no other network calls.
function markdownImage(token, state) {
  const [, alt, target] = token.match(/^!\[([^\]]*)\]\(([^)]*)\)/);
  const path = target.trim().split(/\s+/)[0];
  if (!path || /^([a-z][a-z0-9+.-]*:|\/)/i.test(path)) return element("span", "text-zinc-500 italic dark:text-zinc-400", "[image: " + (alt || path) + "]");
  const image = element("img", "my-1 block h-auto max-w-full rounded border border-zinc-200 dark:border-zinc-800");
  image.alt = alt || path;
  image.src = state.imageBase + path;
  image.addEventListener("load", relayout);
  return image;
}

// Renders Markdown one source line at a time, so every row still maps to exactly one line of the document. A code
// span that wraps onto the next line carries over in `state`.
function inlineMarkdown(text, state) {
  const nodes = [];
  if (state.insideCodeSpan) {
    const closingTick = text.indexOf("`");
    const indent = text.match(/^\s*/)[0];
    const codeEnd = closingTick === -1 ? text.length : closingTick;
    nodes.push(document.createTextNode(indent), element("code", CODE_SPAN, text.slice(indent.length, codeEnd)));
    if (closingTick === -1) return nodes;
    text = text.slice(closingTick + 1);
    state.insideCodeSpan = false;
  }
  const pattern = /(\*\*[^*]+\*\*|`[^`]+`|!\[[^\]]*\]\([^)]*\)|\[[^\]]+\]\([^)]*\))/g;
  let last = 0;
  let match;
  while ((match = pattern.exec(text))) {
    if (match.index > last) nodes.push(document.createTextNode(text.slice(last, match.index)));
    const token = match[0];
    if (token.startsWith("**")) nodes.push(element("strong", "font-semibold", token.slice(2, -2)));
    else if (token.startsWith("`")) nodes.push(element("code", CODE_SPAN, token.slice(1, -1)));
    else if (token.startsWith("![")) nodes.push(markdownImage(token, state));
    else nodes.push(element("span", "underline decoration-zinc-400 underline-offset-2 dark:decoration-zinc-600", token.match(/^\[([^\]]+)\]/)[1]));
    last = pattern.lastIndex;
  }
  const rest = text.slice(last);
  const openingTick = rest.indexOf("`");
  if (openingTick !== -1) {
    nodes.push(document.createTextNode(rest.slice(0, openingTick)), element("code", CODE_SPAN, rest.slice(openingTick + 1)));
    state.insideCodeSpan = true;
  } else if (rest) nodes.push(document.createTextNode(rest));
  return nodes;
}

// Code-block highlighting, one row at a time. A string or comment left open at the end of a
// row (a Python docstring, a /* block */) carries to the next row in `state.codeOpen`.
const words = (list) => new Set(list.split(" "));
const CODE = {
  python: {
    comment: "#", blocks: ['"""', "'''"],
    keywords: words("and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield match case"),
    types: words("int str float bool bytes list dict set tuple object type date datetime timedelta"),
  },
  sql: {
    comment: "--", blocks: ["/*"], caseless: true,
    keywords: words("select from where and or not null is in as on join left right inner outer full cross group by order having limit offset insert into values update set delete create table alter add column drop index unique primary key references foreign default distinct union all case when then else end with returning exists between like conflict do nothing cast coalesce count sum min max now interval true false constraint check nulls asc desc if"),
    types: words("text integer int bigint smallint serial bigserial boolean bool numeric decimal real date time timestamp timestamptz interval jsonb json uuid varchar char bytea"),
  },
  ts: {
    comment: "//", blocks: ["/*"],
    keywords: words("const let var function return if else for while do switch case break continue new class extends implements interface type enum import export from as async await try catch finally throw typeof instanceof in of null undefined true false this void public private protected readonly static default"),
    types: words("string number boolean unknown never any object bigint symbol"),
  },
  shell: {
    comment: "#", blocks: [],
    keywords: words("if then else elif fi for in do done while until case esac function return export local set unset readonly source exit"),
    types: words(""),
  },
};
const CODE_LANGUAGE = {
  python: "python", py: "python", sql: "sql", ts: "ts", typescript: "ts", tsx: "ts", js: "ts",
  javascript: "ts", jsx: "ts", sh: "shell", bash: "shell", shell: "shell", zsh: "shell", console: "shell",
};

function highlightCode(text, state) {
  const spec = CODE[state.language];
  if (!spec) return [document.createTextNode(text || " ")];
  const nodes = [];
  let plain = "";
  let at = 0;
  const flush = () => { if (plain) nodes.push(document.createTextNode(plain)); plain = ""; };
  const token = (kind, value) => { flush(); nodes.push(element("span", TOKEN[kind], value)); at += value.length; };
  if (state.codeOpen) {
    const end = text.indexOf(state.codeOpen.close);
    if (end === -1) token(state.codeOpen.kind, text);
    else { token(state.codeOpen.kind, text.slice(0, end + state.codeOpen.close.length)); state.codeOpen = null; }
  }
  while (at < text.length) {
    const rest = text.slice(at);
    const before = text.slice(0, at);
    const opener = spec.blocks.find((mark) => rest.startsWith(mark));
    let match;
    if (rest.startsWith(spec.comment)) token("comment", rest);
    else if (opener) {
      const close = opener === "/*" ? "*/" : opener;
      const kind = opener === "/*" ? "comment" : "string";
      const end = rest.indexOf(close, opener.length);
      if (end === -1) { token(kind, rest); state.codeOpen = { close, kind }; }
      else token(kind, rest.slice(0, end + close.length));
    } else if ((match = rest.match(/^(["'`])(?:\\.|(?!\1).)*\1?/))) token("string", match[0]);
    // A template's `<placeholder>`, never a generic like Promise<void>.
    else if (!/[\w)\]]$/.test(before) && (match = rest.match(/^<[a-z`(][^<>]*>/i))) token("placeholder", match[0]);
    else if (state.language === "python" && (match = rest.match(/^@[\w.]+/))) token("decorator", match[0]);
    else if (!/\w$/.test(before) && (match = rest.match(/^\d[\d_.]*/))) token("number", match[0]);
    else if ((match = rest.match(/^[A-Za-z_]\w*/))) {
      const word = match[0];
      const key = spec.caseless ? word.toLowerCase() : word;
      if (spec.keywords.has(key)) token("keyword", word);
      else if (spec.types.has(key) || (!spec.caseless && /^[A-Z]/.test(word))) token("type", word);
      else if (/^\s*\(/.test(rest.slice(word.length))) token("function", word);
      else { plain += word; at += word.length; }
    } else { plain += text[at]; at += 1; }
  }
  flush();
  return nodes.length ? nodes : [document.createTextNode(" ")];
}

function markdownLine(text, state) {
  const span = element("span", TEXT);
  let match;
  if (!text.trim()) state.insideCodeSpan = false;
  // A block closes only on a bare fence at least as long as the one that opened it, so a
  // shorter or labelled fence inside a ```` block is that block's text, as in markdown.
  if ((match = text.match(/^\s*(`{3,})\s*(\S*)/))) {
    const closes = state.fence && !match[2] && match[1].length >= state.fence.length;
    if (!state.fence || closes) {
      state.fence = closes ? false : match[1];
      state.language = closes ? null : CODE_LANGUAGE[match[2].toLowerCase()] || null;
      state.codeOpen = null;
      span.className = FENCE + " text-zinc-400 dark:text-zinc-500";
      span.textContent = state.fence ? match[2] || "code" : " ";
      return span;
    }
  }
  if (state.fence) {
    span.className = FENCE;
    span.append(...highlightCode(text, state));
    return span;
  }
  if (/^\s*\|.*\|\s*$/.test(text)) {
    const rule = /^[\s|:-]+$/.test(text);
    span.className = TEXT + " md-cells" + (rule ? " md-rule" : "");
    span.append(...text.trim().slice(1, -1).split(/(?<!\\)\|/).map((cell) => {
      const node = element("span", CELL);
      if (!rule) node.append(...inlineMarkdown(cell.trim().replaceAll("\\|", "|"), state));
      return node;
    }));
    return span;
  }
  if ((match = text.match(/^(#{1,6})\s+(.*)$/))) {
    span.className += " " + HEADING[Math.min(match[1].length, 4) - 1];
    span.append(...inlineMarkdown(match[2], state));
    return span;
  }
  if ((match = text.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/))) {
    span.style.paddingLeft = (Math.floor(match[1].length / 2) * 16) + "px";
    span.append(element("span", "mr-2 text-zinc-500 dark:text-zinc-400", /\d/.test(match[2]) ? match[2] : "•"), ...inlineMarkdown(match[3], state));
    return span;
  }
  if ((match = text.match(/^\s*<summary>(.*)<\/summary>\s*$/))) {
    span.className = TEXT + " font-semibold";
    span.textContent = "▸ " + match[1];
    return span;
  }
  if (/^\s*(<\/?details>|<!--.*-->)\s*$/.test(text)) {
    span.className = TEXT + " font-mono text-xs/6 text-zinc-500 dark:text-zinc-400";
    span.textContent = text.trim();
    return span;
  }
  if ((match = text.match(/^>\s?(.*)$/))) {
    span.className += " border-l-2 border-zinc-200 pl-3 text-zinc-500 dark:border-zinc-700 dark:text-zinc-400";
    span.append(...inlineMarkdown(match[1], state));
    return span;
  }
  span.append(...(text ? inlineMarkdown(text, state) : [document.createTextNode(" ")]));
  return span;
}

// A ```mermaid block is drawn in place of its lines, which fold away (see foldSource). Mermaid
// is served by the helper from its own folder, so the page still calls nothing outside this
// machine. When it is missing, or a diagram does not parse, the block stays as its text.
let mermaidLoaded = null;
const drawnDiagrams = new Map();
// Every render gets an id no other render has had. Mermaid draws into whichever element holds
// the id, so a reused one draws a second diagram into the first and leaves the second empty.
let diagramsRendered = 0;
function loadMermaid() {
  mermaidLoaded ??= new Promise((resolve) => {
    const script = document.createElement("script");
    script.src = "/mermaid.js";
    script.onload = () => resolve(window.mermaid || null);
    script.onerror = () => resolve(null);
    document.head.append(script);
  });
  return mermaidLoaded;
}

async function drawDiagrams(diagrams) {
  if (!diagrams.length) return;
  const mermaid = await loadMermaid();
  const theme = document.documentElement.dataset.theme === "dark" ? "dark" : "default";
  if (mermaid) mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme,
    themeVariables: theme === "dark" ? { lineColor: "#c9d1d9" } : {},
    themeCSS: ".flowchart-link { stroke-width: 1.6px; }",
    flowchart: { htmlLabels: true, useMaxWidth: false, wrappingWidth: 320 },
  });
  for (const diagram of diagrams) {
    const source = diagram.lines.join("\n");
    const key = theme + "\n" + source;
    if (!drawnDiagrams.has(key) && mermaid && await mermaid.parse(source, { suppressErrors: true })) {
      try {
        drawnDiagrams.set(key, (await mermaid.render("diagram-" + ++diagramsRendered, source)).svg);
      } catch {
        // Left as its text below.
      }
    }
    if (drawnDiagrams.has(key)) {
      diagram.figure.innerHTML = drawnDiagrams.get(key);
      diagram.figure.title = "Click to zoom";
      diagram.figure.onclick = (event) => zoomDiagram(diagram.figure, event);
      frameDiagram(diagram, key);
    } else diagram.block.remove();
  }
  relayout();
}

// A drawn diagram carries its first and last line numbers, and a click on either comments on
// the whole diagram. Its source lines fold away, one click from view. They stay shown while
// one holds a change or a comment on less than the whole diagram, so folding hides neither.
const shownSources = new Set();
function frameDiagram(diagram, key) {
  const { item, block, rows } = diagram;
  const start = Number(rows[0].dataset.index);
  const end = Number(rows[rows.length - 1].dataset.index);
  const notes = notesOf(item).filter((note) => note.start <= end && note.end >= start);
  const whole = notes.find((note) => note.start === start && note.end === end);
  block.dataset.start = start;
  block.dataset.end = end;
  block.toggleAttribute("data-commented", Boolean(whole));
  const open = () => { lastClicked = null; openEditor(item, start, end, whole || null); };
  const gutter = element("span", "flex w-5 flex-none cursor-pointer justify-center", whole ? "💬" : "");
  const numbers = element("button", "my-1 flex min-w-8 flex-none cursor-pointer flex-col justify-between py-1 text-right font-mono text-xs text-zinc-400 hover:text-zinc-900 focus-visible:outline-2 focus-visible:outline-zinc-900 dark:text-zinc-500 dark:hover:text-zinc-100 dark:focus-visible:outline-zinc-100");
  numbers.append(element("span", "", String(start + 1)), element("span", "", String(end + 1)));
  numbers.title = "Comment on the whole diagram";
  numbers.setAttribute("aria-label", "Comment on the diagram, lines " + (start + 1) + " to " + (end + 1));
  gutter.onclick = numbers.onclick = open;
  block.prepend(gutter, numbers);
  if (rows.some((row) => row.hasAttribute("data-changed")) || notes.some((note) => note !== whole)) return;
  const button = element("button", "cursor-pointer text-xs text-zinc-500 hover:text-zinc-900 hover:underline focus-visible:outline-2 focus-visible:outline-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 dark:focus-visible:outline-zinc-100");
  const show = (shown) => {
    rows.forEach((row) => { row.hidden = !shown; });
    button.textContent = (shown ? "Hide source" : "Show source") + " (" + rows.length + " lines)";
  };
  button.onclick = () => {
    if (shownSources.has(key)) shownSources.delete(key);
    else shownSources.add(key);
    show(shownSources.has(key));
    relayout();
  };
  show(shownSources.has(key));
  const row = element("div", "mb-2 flex gap-3 border-l-4 border-transparent px-2");
  row.append(...inset(), button);
  block.after(row);
}

// A diagram fits its frame, so its whole shape shows, but a wide one's text is then too small
// to read. A click shows it at full size, scrolled to keep the clicked point under the pointer.
function zoomDiagram(figure, event) {
  const svg = figure.querySelector("svg");
  const before = svg.getBoundingClientRect();
  const x = (event.clientX - before.left) / before.width;
  const y = (event.clientY - before.top) / before.height;
  const zoomed = figure.classList.toggle("zoomed");
  figure.title = zoomed ? "Click to fit" : "Click to zoom";
  const after = svg.getBoundingClientRect();
  figure.scrollLeft = after.left - figure.getBoundingClientRect().left + figure.scrollLeft + x * after.width - (event.clientX - figure.getBoundingClientRect().left);
  window.scrollBy(0, after.top + y * after.height - event.clientY);
  relayout();
}

function renderLines(container, item) {
  const list = notesOf(item);
  const diagrams = [];
  let diagram = null;
  const markdown = { fence: false, language: null, codeOpen: null, insideCodeSpan: false, imageBase: "/image/" + DATA.documents.indexOf(item) + "/" };
  const changed = new Set(item.changed);
  const removedAt = new Map((item.removed || []).map((block) => [block.at, block.lines]));
  const children = [];
  let table = null;
  // Lines the text has lost sit where they were cut: shown, never numbered or commentable.
  const cut = (index) => {
    const lost = removedAt.get(index);
    if (!lost) return;
    const block = element("div", "flex gap-3 border-l-4 border-rose-500 bg-rose-50 px-2 py-1 text-zinc-500 select-text dark:border-rose-400/70 dark:bg-rose-400/10 dark:text-zinc-400");
    block.setAttribute("role", "note");
    block.setAttribute("aria-label", lost.length + (lost.length === 1 ? " line" : " lines") + " removed: " + lost.join(" "));
    const text = element("div", "min-w-0 flex-1 whitespace-pre-wrap");
    text.append(element("span", "block text-xs font-semibold text-rose-600 dark:text-rose-300", "− " + lost.length + (lost.length === 1 ? " line removed" : " lines removed")));
    lost.forEach((line) => text.append(element("del", "block line-through decoration-red-600 dark:decoration-red-400", line || " ")));
    block.append(...inset(), text);
    table = null;
    children.push(block);
  };
  item.lines.forEach((text, index) => {
    cut(index);
    const opensDiagram = !markdown.fence && /^\s*`{3,}\s*mermaid\s*$/i.test(text);
    if (opensDiagram) {
      diagram = {
        item,
        block: element("div", "md-diagram-line group/diagram flex gap-3 rounded border-l-4 border-transparent px-2 data-selected:border-zinc-900 data-selected:bg-zinc-100 dark:data-selected:border-zinc-100 dark:data-selected:bg-white/5"),
        figure: element("div", "md-diagram my-1 w-max flex-none overflow-x-auto rounded-lg border border-zinc-200 bg-white p-2 group-data-commented/diagram:border-amber-400 group-data-commented/diagram:bg-amber-50 dark:border-white/10 dark:bg-zinc-950/40 dark:group-data-commented/diagram:border-yellow-400 dark:group-data-commented/diagram:bg-amber-300/10"),
        lines: [],
        rows: [],
      };
      diagram.block.append(diagram.figure);
      diagrams.push(diagram);
      table = null;
      children.push(diagram.block);
    }
    const commented = list.some((note) => index >= note.start && index <= note.end);
    const row = element("div", ROW);
    row.dataset.index = index;
    row.toggleAttribute("data-changed", changed.has(index));
    row.toggleAttribute("data-commented", commented);
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.setAttribute("aria-label", "Line " + (index + 1) + (changed.has(index) ? ", changed" : "") + (commented ? ", has a comment" : "") + ": " + text);
    const gutter = element("span", "gutter flex w-5 flex-none justify-center self-start");
    list.filter((note) => note.start === index).forEach((note) => {
      const badge = element("span", "badge cursor-pointer rounded-full hover:ring-2 hover:ring-amber-400 dark:hover:ring-amber-300", "💬");
      badge.dataset.key = note.key;
      badge.title = note.comment;
      gutter.append(badge);
    });
    const content = markdownLine(text, markdown);
    if (diagram) diagram.rows.push(row);
    if (diagram && !opensDiagram) {
      if (markdown.fence) diagram.lines.push(text);
      else diagram = null;
    }
    row.append(gutter, element("span", "number min-w-8 flex-none text-right font-mono text-xs/6 text-zinc-400 dark:text-zinc-600", index + 1), content);
    if (!content.matches(".md-cells")) {
      table = null;
      children.push(row);
      return;
    }
    if (!table) {
      table = element("div", "md-table");
      table.style.gridTemplateColumns = "auto auto repeat(" + content.childElementCount + ", auto)";
      children.push(table);
      row.classList.add("md-head");
    }
    if (content.matches(".md-rule")) row.classList.add("md-rule");
    table.append(row);
  });
  cut(item.lines.length);
  container.replaceChildren(...children);
  drawDiagrams(diagrams);
}

// Whatever sits beside a line: the line's row, or the diagram drawn in place of a folded one, which has no position.
function anchorOf(lines, index) {
  const row = lines.querySelector('.line[data-index="' + index + '"]');
  const diagram = [...lines.querySelectorAll(".md-diagram-line")].find((block) => index >= Number(block.dataset.start) && index <= Number(block.dataset.end));
  return row.hidden && diagram ? diagram : row;
}

function renderMargin(margin, lines, item) {
  margin.querySelectorAll(".card").forEach((card) => card.remove());
  let nextFreeTop = 0;
  notesOf(item).forEach((note) => {
    const card = element("button", "card absolute right-0 left-0 cursor-pointer rounded-lg border border-zinc-200 border-l-2 border-l-amber-400 dark:border-l-amber-300/70 bg-amber-50 px-3 py-2 text-left shadow-xs hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900 dark:border-zinc-800 dark:bg-amber-300/10 dark:focus-visible:outline-zinc-100");
    card.append(
      element("span", "float-right ml-2 hidden rounded-full border border-zinc-200 px-2 text-xs text-zinc-500 group-data-working/page:inline-block dark:border-zinc-700 dark:text-zinc-400", "sent · Claude is on it"),
      element("div", "text-xs text-zinc-500 dark:text-zinc-400", lineLabel(note.start, note.end).toLowerCase()),
      element("div", "whitespace-pre-wrap", note.comment),
    );
    card.setAttribute("aria-label", "Edit comment on " + lineLabel(note.start, note.end).toLowerCase() + ": " + note.comment);
    card.onclick = () => openEditor(item, note.start, note.end, note);
    card.onmouseenter = () => { hovered = { id: item.id, start: note.start, end: note.end }; highlight(); };
    card.onmouseleave = () => { hovered = null; highlight(); };
    card.onfocus = card.onmouseenter;
    card.onblur = card.onmouseleave;
    margin.append(card);
    const top = Math.max(anchorOf(lines, note.start).offsetTop, nextFreeTop);
    card.style.top = top + "px";
    nextFreeTop = top + card.offsetHeight + 8;
  });
  margin.style.minHeight = Math.max(lines.offsetHeight, nextFreeTop) + "px";
}

function renderSheets() {
  // The open comment box lives in a margin this replaces, so it closes first.
  if (byId("sheets").contains(editor)) closeEditor();
  const items = shownItems();
  const title = items.length > 1 ? items[0].group : items[0].title;
  const folder = title.slice(0, title.lastIndexOf("/") + 1);
  byId("title").replaceChildren(title.slice(folder.length), element("span", "block text-xs font-normal text-zinc-400 dark:text-zinc-500", folder));
  document.body.toggleAttribute("data-compare", items.length > 1);
  const container = byId("sheets");
  container.replaceChildren(...items.map((item) => {
    const sheet = element("div", "sheet mx-auto w-full min-w-0 max-w-7xl");
    sheet.dataset.id = item.id;
    // One row above the sheet, as wide as it: the version (side by side), the overall comment link, Reviewed.
    const head = element("div", "mb-2 flex max-w-4xl items-center gap-4");
    if (items.length > 1) head.append(element("h2", "font-semibold", versionLabel(item)));
    const reviewed = element("label", "ml-auto inline-flex cursor-pointer items-center gap-2 text-zinc-500 dark:text-zinc-400");
    const box = element("input", "size-4 cursor-pointer accent-zinc-900 dark:accent-zinc-100");
    box.type = "checkbox";
    box.checked = metaOf(item).reviewed;
    box.onchange = () => { metaOf(item).reviewed = box.checked; persist(); renderDocuments(); };
    reviewed.append(box, " Reviewed");
    head.append(reviewed);
    const overall = element("textarea", FIELD + " mb-3 block min-h-9 max-w-4xl field-sizing-content");
    overall.rows = 1;
    overall.placeholder = "Overall comment on this document (optional)";
    overall.setAttribute("aria-label", "Overall comment on " + item.title);
    overall.value = metaOf(item).overall;
    overall.oninput = () => { metaOf(item).overall = overall.value; persist(); };
    const addOverall = element("button", "cursor-pointer text-sm text-zinc-500 hover:text-zinc-900 hover:underline focus-visible:outline-2 focus-visible:outline-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 dark:focus-visible:outline-zinc-100", "Add an overall comment");
    addOverall.type = "button";
    overall.hidden = !metaOf(item).overall;
    addOverall.hidden = !overall.hidden;
    addOverall.onclick = () => { addOverall.hidden = true; overall.hidden = false; overall.focus(); };
    head.insertBefore(addOverall, reviewed);
    // The margin is position: relative, and cards and the comment box take their top from a row's offsetTop.
    const body = element("div", "relative flex gap-8 group-data-compare/page:gap-4");
    const lines = element("div", "lines min-w-0 max-w-4xl flex-1 rounded-xl bg-white py-2 ring-1 ring-zinc-200 dark:bg-zinc-800/40 dark:ring-white/5");
    const margin = element("div", "margin pointer-events-none relative w-80 flex-none group-data-compare/page:w-56 *:pointer-events-auto");
    body.append(lines, margin);
    sheet.append(head, overall, body);
    renderLines(lines, item);
    return sheet;
  }));
  relayout();
}

function relayout() {
  shownItems().forEach((item) => {
    const sheet = sheetOf(item);
    renderMargin(sheet.querySelector(".margin"), sheet.querySelector(".lines"), item);
  });
  if (selection && !editor.hidden) placeEditor();
}

function highlight() {
  const range = selection || hovered;
  document.querySelectorAll(".sheet").forEach((sheet) => {
    sheet.querySelectorAll(".line").forEach((row) => {
      const index = Number(row.dataset.index);
      row.toggleAttribute("data-selected", Boolean(range) && range.id === sheet.dataset.id && index >= range.start && index <= range.end);
    });
    sheet.querySelectorAll(".md-diagram-line").forEach((block) => {
      block.toggleAttribute("data-selected", Boolean(range) && range.id === sheet.dataset.id && range.start <= Number(block.dataset.end) && range.end >= Number(block.dataset.start));
    });
  });
}

// The comment box sits in the margin of the sheet it is about, level with the first line of the selection and
// above any card there. Returns what it sits beside.
function placeEditor() {
  const anchor = anchorOf(sheetOf(itemById(selection.id)).querySelector(".lines"), selection.start);
  editor.style.top = anchor.offsetTop + "px";
  return anchor;
}

function openEditor(item, start, end, note) {
  // While the agent is changing the documents, a comment would land on text that is about to move.
  if (working) { status(PAUSED); return; }
  selection = { id: item.id, start, end, key: note ? note.key : null };
  const first = item.lines[start];
  byId("quoted").replaceChildren(
    element("span", "font-semibold text-zinc-700 dark:text-zinc-300", (compare ? versionLabel(item) + ", " : "") + lineLabel(start, end)),
    element("span", "truncate border-l-2 border-zinc-300 pl-2 dark:border-zinc-600", first.trim() + (end > start ? " …" : "")),
  );
  byId("comment").value = note ? note.comment : "";
  byId("clear").hidden = !note;
  sheetOf(item).querySelector(".margin").append(editor);
  editor.hidden = false;
  const anchor = placeEditor();
  highlight();
  byId("comment").focus({ preventScroll: true });
  anchor.scrollIntoView({ block: "center", behavior: "smooth" });
}

function openAt(item, start, end) {
  const existing = start === end ? notesOf(item).find((note) => start >= note.start && start <= note.end) : null;
  if (existing) openEditor(item, existing.start, existing.end, existing);
  else openEditor(item, start, end, null);
}

// Closed, the comment box waits outside the sheets, so a render that replaces them never takes it along.
function closeEditor() { editor.hidden = true; document.body.append(editor); selection = null; highlight(); }

function render() { renderDocuments(); renderSheets(); highlight(); }

const sheets = byId("sheets");
sheets.addEventListener("mousedown", (event) => {
  const row = event.target.closest(".line");
  if (!row || event.button !== 0) return;
  event.preventDefault();
  const item = itemById(row.closest(".sheet").dataset.id);
  const badge = event.target.closest(".badge");
  if (badge) {
    const note = notesOf(item).find((candidate) => candidate.key === badge.dataset.key);
    if (note) openEditor(item, note.start, note.end, note);
    return;
  }
  const index = Number(row.dataset.index);
  if (event.shiftKey && lastClicked && lastClicked.id === item.id) {
    openEditor(item, Math.min(lastClicked.index, index), Math.max(lastClicked.index, index), null);
    return;
  }
  drag = { id: item.id, start: index };
  selection = { id: item.id, start: index, end: index, key: null };
  highlight();
});
sheets.addEventListener("mouseover", (event) => {
  if (!drag) return;
  const row = event.target.closest(".line");
  if (!row || row.closest(".sheet").dataset.id !== drag.id) return;
  const index = Number(row.dataset.index);
  selection = { id: drag.id, start: Math.min(drag.start, index), end: Math.max(drag.start, index), key: null };
  highlight();
});
document.addEventListener("mouseup", () => {
  if (!drag) return;
  const { id, start, end } = selection;
  drag = null;
  lastClicked = start === end ? { id, index: start } : null;
  openAt(itemById(id), start, end);
});
sheets.addEventListener("keydown", (event) => {
  const row = event.target.closest(".line");
  if (!row || (event.key !== "Enter" && event.key !== " ")) return;
  event.preventDefault();
  const item = itemById(row.closest(".sheet").dataset.id);
  const index = Number(row.dataset.index);
  if (event.shiftKey && lastClicked && lastClicked.id === item.id) {
    openEditor(item, Math.min(lastClicked.index, index), Math.max(lastClicked.index, index), null);
  } else {
    lastClicked = { id: item.id, index };
    openAt(item, index, index);
  }
});

// Keeps the open comment, if it has text. Returns the lines it covers, or null.
function saveOpenComment() {
  const comment = byId("comment").value.trim();
  if (!selection || !comment) return null;
  const { id, start, end } = selection;
  const item = itemById(id);
  notes[selection.key || rangeKey(item, start, end)] = { comment };
  persist();
  return { item, start, end };
}

byId("save").onclick = () => {
  const saved = saveOpenComment();
  if (!saved) return;
  closeEditor(); render();
  const sheet = sheetOf(saved.item);
  for (let index = saved.start; index <= saved.end; index += 1) rowAt(sheet, index).classList.add("flash");
};
byId("send-now").onclick = () => {
  saveOpenComment();
  closeEditor(); render();
  sendAll();
};
byId("clear").onclick = () => {
  if (selection && selection.key) { delete notes[selection.key]; persist(); }
  closeEditor(); render();
};
byId("close").onclick = closeEditor;
byId("comment").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) byId("send-now").click();
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeEditor(); });
window.addEventListener("resize", relayout);

byId("view").hidden = !DATA.documents.some(siblingOf);
// The agent's answer to the last Send sits under the Send box. A reopen without one hides it.
if (DATA.reply) {
  byId("agent-reply").hidden = false;
  byId("agent-reply-text").replaceChildren(...DATA.reply.split("\n").filter((line) => line.trim()).map((line) => {
    const item = /^\s*[-*]\s+/.test(line);
    const paragraph = element("p", item ? "pl-3 -indent-3" : "");
    paragraph.append(...(item ? ["• "] : []), ...inlineMarkdown(line.replace(/^\s*[-*]\s+/, ""), { insideCodeSpan: false }));
    return paragraph;
  }));
}
byId("changed-hint").hidden = !DATA.documents.some((item) => item.changed.length);
byId("removed-hint").hidden = !DATA.documents.some((item) => (item.removed || []).length);
if (DATA.base) {
  byId("changed-label").textContent = "Changed since " + DATA.base;
  byId("removed-label").textContent = "Removed since " + DATA.base;
}
byId("compare").checked = compare;
byId("compare").onchange = () => {
  compare = byId("compare").checked;
  localStorage.setItem("annotate:compare", String(compare));
  // Off falls back to the newer version, never the baseline the pair was showing beside it.
  const sibling = siblingOf(documentAt());
  if (!compare && sibling && isBaseline(documentAt())) current = DATA.documents.indexOf(sibling);
  closeEditor(); render();
};

const systemDark = window.matchMedia("(prefers-color-scheme: dark)");
const applyTheme = () => { document.documentElement.dataset.theme = systemDark.matches ? "dark" : "light"; };
systemDark.addEventListener("change", applyTheme);
applyTheme();

function collect() {
  return {
    name: DATA.name,
    comments: DATA.documents.flatMap((item) => notesOf(item).map((note) => ({
      document: item.title,
      group: item.group,
      version: item.version,
      start_line: note.start + 1,
      end_line: note.end + 1,
      text: item.lines.slice(note.start, note.end + 1).join("\n"),
      comment: note.comment
    }))),
    documents: DATA.documents.map((item) => ({ document: item.title, group: item.group, version: item.version, reviewed: metaOf(item).reviewed, overall: metaOf(item).overall }))
  };
}

function asText() {
  const lines = ["Comments from " + DATA.name + ":"];
  DATA.documents.forEach((item) => {
    const list = notesOf(item);
    const { reviewed, overall } = metaOf(item);
    if (!list.length && !overall && !reviewed) return;
    lines.push("", "## " + item.title + (reviewed ? " [reviewed]" : ""));
    if (overall) lines.push("Overall: " + overall);
    list.forEach((note) => {
      const first = item.lines[note.start].trim();
      lines.push("- " + lineLabel(note.start, note.end) + ' ("' + first.slice(0, 70) + (first.length > 70 ? "..." : "") + '"): ' + note.comment);
    });
  });
  return lines.join("\n");
}

function status(text) { byId("status").textContent = text; }

byId("copy").onclick = async () => {
  const text = asText();
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const scratch = element("textarea");
    scratch.value = text;
    document.body.append(scratch);
    scratch.select();
    document.execCommand("copy");
    scratch.remove();
  }
  status("Copied. Paste it to the agent.");
};

// After a Send the helper has exited and the agent is working. Show that, with how long it has been, until the page
// comes back with the changes.
function showWorking() {
  const banner = byId("working");
  const started = Date.now();
  const tick = () => {
    const seconds = Math.floor((Date.now() - started) / 1000);
    banner.replaceChildren("Sent. Claude is working on your comments · ",
      element("b", "font-semibold tabular-nums", Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0")),
      ". Commenting is paused while the documents change; this page reloads by itself with the changes highlighted.");
  };
  tick();
  banner.hidden = false;
  setInterval(tick, 1000);
}

// The helper exits on Send. When the agent starts it again on the same files, it answers with a new session.
function reloadWhenReopened() {
  setTimeout(async () => {
    try {
      const response = await fetch("/ping", { cache: "no-store" });
      if ((await response.json()).session !== DATA.session) return location.reload();
    } catch {
      // Not back yet.
    }
    reloadWhenReopened();
  }, 2000);
}

const PAUSED = "Claude is changing these documents, so commenting is paused. You can comment again when the new version loads.";

// Sends every saved comment and the instruction. Commenting and Send stay paused until the agent reopens the page.
// While they are, the body carries data-working: commented lines dim and every card says it was sent.
async function sendAll() {
  working = true;
  document.body.toggleAttribute("data-working", true);
  byId("send").disabled = byId("send-now").disabled = true;
  status("Sending...");
  try {
    const body = JSON.stringify({ token: DATA.token, instruction: byId("instruction").value.trim(), text: asText(), ...collect() });
    const response = await fetch("/send", { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (!response.ok) throw new Error(String(response.status));
    status(PAUSED);
    showWorking();
    reloadWhenReopened();
  } catch (error) {
    working = false;
    document.body.toggleAttribute("data-working", false);
    byId("send").disabled = byId("send-now").disabled = false;
    status("Couldn't reach the agent (" + error.message + "). Use Copy instead.");
  }
}

byId("send").onclick = sendAll;

render();
</script>
</body>
</html>
